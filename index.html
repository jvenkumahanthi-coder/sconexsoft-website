<title>SconexSoft</title>
<meta name="description" content="SconexSoft builds enterprise applications, ERP, mobile apps, AI and cloud solutions, and provides IT staffing. Offices in Visakhapatnam, India and Tennessee, USA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Brand system taken from sconexsoft.com: red #E51937, charcoal #444343, Poppins + DM Sans.
   Layout: white brand surfaces with charcoal "engine room" bands; red used sparingly for action and emphasis.
   Single light look by choice, because the official logo's charcoal wordmark needs a light ground. */
:root{
  color-scheme:light;
  --red:#E51937; --red-deep:#B5102A; --red-tint:#FDECEE;
  --char:#444343; --ink:#1E1D1D; --night:#191818; --night-2:#252424;
  --text:#55545A; --muted:#7A7980; --line:#E6E6EB; --mist:#F6F6F8; --white:#FFFFFF;
  --on-dark:#F2F1F1; --on-dark-2:#B9B7B7;
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --wrap:1200px; --gut:20px; --r:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--white);color:var(--text);font:400 16.5px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2.2rem,5.2vw,3.9rem);font-weight:700}
h2{font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:700}
h3{font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 .78rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}
.lead{font-size:1.12rem;max-width:62ch}
:focus-visible{outline:2.5px solid var(--red);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.6em;font:600 .95rem/1 var(--f-display);padding:1em 1.4em;border-radius:10px;border:1.5px solid transparent;cursor:pointer;transition:transform .25s var(--ease),background-position .5s var(--ease),box-shadow .25s,border-color .25s,color .25s,background-color .25s;white-space:nowrap}
.btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translate(2px,-2px)}
.btn-red{color:#fff;background:linear-gradient(90deg,var(--red) 0%,var(--red) 45%,var(--char) 100%);background-size:220% 100%;background-position:0 0;box-shadow:0 8px 24px -10px rgba(229,25,55,.6)}
.btn-red:hover{background-position:100% 0;transform:translateY(-1px)}
.btn-ghost{color:var(--ink);border-color:var(--line);background:var(--white)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost-dark{color:#fff;border-color:rgba(255,255,255,.28)}
.btn-ghost-dark:hover{border-color:#fff;background:rgba(255,255,255,.06)}

/* top bar + header */
.topbar{background:transparent;color:var(--muted);font-size:.82rem;overflow:hidden;max-height:60px;transition:max-height .35s var(--ease),opacity .3s,color .3s;border-bottom:1px solid rgba(30,29,29,.07)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:8px;flex-wrap:wrap}
.topbar .tb-l{display:flex;gap:22px;flex-wrap:wrap}
.topbar .tb-l span{display:inline-flex;align-items:center;gap:7px}
.topbar svg{width:14px;height:14px;color:var(--red)}
.topbar .tb-r{display:flex;gap:16px}
.topbar a{transition:color .2s}.topbar a:hover{color:var(--red)}
@media (max-width:760px){.topbar .tb-hide{display:none}.topbar{font-size:.78rem}.topbar .tb-l{gap:14px}}
.mast{position:fixed;left:0;right:0;top:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:transparent;transition:background .35s,box-shadow .35s,backdrop-filter .35s}
.mast .topbar .wrap,.mast .hd{max-width:1320px}
header.site{background:transparent;border-bottom:1px solid transparent;transition:border-color .3s}
.logo{position:relative}
.logo .lg-l{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s}
.logo .lg-d{transition:opacity .35s}
/* glass pill nav */
nav.main{padding:5px;border-radius:999px;background:rgba(30,29,29,.035);border:1px solid rgba(30,29,29,.06);transition:background .35s,border-color .35s}
.nv>a.on{background:#fff;box-shadow:0 2px 10px -4px rgba(30,29,29,.25)}
.nv>a,.nv>button{border-radius:999px!important}
/* over the dark hero */
.mast.on-dark .topbar{color:rgba(255,255,255,.62);border-bottom-color:rgba(255,255,255,.08)}
.mast.on-dark .topbar a:hover{color:#fff}
.mast.on-dark .logo .lg-l{opacity:1}
.mast.on-dark .logo .lg-d{opacity:0}
.mast.on-dark nav.main{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mast.on-dark .nv>a,.mast.on-dark .nv>button{color:rgba(255,255,255,.86)}
.mast.on-dark .nv>a:hover,.mast.on-dark .nv>button:hover,.mast.on-dark .nv.open>button{color:#fff;background:rgba(255,255,255,.08)}
.mast.on-dark .nv>a.on{color:#fff;background:var(--red);box-shadow:0 6px 16px -6px rgba(229,25,55,.7)}
.mast.on-dark .burger{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.mast.on-dark .burger svg{color:#fff}
/* scrolled: frosted white bar */
.mast.scrolled{background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);box-shadow:0 10px 30px -22px rgba(30,29,29,.45)}
.mast.scrolled .topbar{max-height:0;opacity:0;border-bottom-color:transparent}
.mast.scrolled header.site{border-bottom-color:rgba(30,29,29,.06)}
.mast.scrolled .logo .lg-l{opacity:0}.mast.scrolled .logo .lg-d{opacity:1}
.mast.scrolled nav.main{background:rgba(30,29,29,.035);border-color:rgba(30,29,29,.06);backdrop-filter:none}
.mast.scrolled .nv>a,.mast.scrolled .nv>button{color:var(--char)}
.mast.scrolled .nv>a:hover,.mast.scrolled .nv>button:hover{color:var(--red);background:transparent}
.mast.scrolled .nv>a.on{color:var(--red);background:#fff;box-shadow:0 2px 10px -4px rgba(30,29,29,.25)}
.mast.scrolled .burger{background:#fff;border-color:var(--line)}.mast.scrolled .burger svg{color:var(--char)}
/* softer dropdowns: frosted on light, dark glass over the dark hero */
.dd{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-color:rgba(30,29,29,.07)}
.mast.on-dark:not(.scrolled) .dd{background:linear-gradient(180deg,#2a2223,#1d1a1b 60%);border-color:rgba(255,255,255,.1);box-shadow:0 30px 60px -24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.mast.on-dark:not(.scrolled) .dd a{color:rgba(255,255,255,.92)}
.mast.on-dark:not(.scrolled) .dd a small{color:rgba(255,255,255,.5)}
.mast.on-dark:not(.scrolled) .dd a:hover{background:rgba(255,255,255,.07);color:#fff}
.mast.on-dark:not(.scrolled) .dd a:hover small{color:rgba(255,255,255,.66)}
.mast.on-dark:not(.scrolled) .dd h5{color:rgba(255,255,255,.45)}
.mast.on-dark:not(.scrolled) .dd .lt{box-shadow:none}
nav.main{position:relative}
.nv:has(.dd.mega){position:static}
.dd.mega{left:50%;right:auto;transform:translate(-50%,8px)}
.nv.open .dd.mega{transform:translate(-50%,0)}
#view>section:first-child{padding-top:var(--mh,118px)}

header.site .wrap.hd{max-width:1320px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px;transition:height .3s var(--ease)}
.mast.scrolled .hd{height:66px}
.logo{flex:none;display:block}
.logo img{height:26px;width:278px;max-width:none;image-rendering:-webkit-optimize-contrast}
@media (max-width:420px){.logo img{height:22px;width:235px}}
nav.main{display:flex;align-items:center;gap:4px}
.nv{position:relative}
.nv>a,.nv>button{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font:500 .9rem/1 var(--f-display);color:var(--char);padding:12px 9px;border-radius:8px;background:none;border:0;cursor:pointer;transition:color .2s,background .2s}
.nv>a:hover,.nv>button:hover,.nv.open>button,.nv>a.on{color:var(--red)}
.nv>a,.nv>button{transition:color .2s,background .25s,box-shadow .25s}
.nv>button svg{width:14px;height:14px;transition:transform .25s}
.nv.open>button svg{transform:rotate(180deg)}
.dd{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 60px -30px rgba(30,29,29,.35);padding:14px;opacity:0;visibility:hidden;transition:opacity .22s,transform .22s var(--ease),visibility .22s;min-width:280px}
.nv.open .dd{opacity:1;visibility:visible;transform:translate(-50%,0)}
.dd.mega{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 18px;width:min(1080px,92vw);padding:24px 26px;left:auto;right:-260px;transform:translateY(8px)}
.nv.open .dd.mega{transform:translateY(0)}
.dd h5{margin:0 0 8px;font:600 .72rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dd a{display:block;padding:8px 10px;margin-inline:-10px;border-radius:8px;font-size:.93rem;color:var(--ink);transition:background .15s,color .15s}
.dd a:hover{background:var(--mist);color:var(--red)}
.dd a small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
.hd-cta{display:flex;align-items:center;gap:10px}
.burger{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center}
.burger svg{width:22px;height:22px;color:var(--char)}
@media (max-width:1240px){nav.main,.hd-cta .btn{display:none}.burger{display:inline-flex}}

/* mobile drawer */
.drawer{position:fixed;inset:0;z-index:80;visibility:hidden}
.drawer.open{visibility:visible}
.drawer .scrim{position:absolute;inset:0;background:rgba(25,24,24,.5);opacity:0;transition:opacity .3s}
.drawer.open .scrim{opacity:1}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.open .panel{transform:none}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.panel-b{overflow-y:auto;flex:1;padding-block:8px}
.panel details{border-bottom:1px solid var(--line)}
.panel summary{list-style:none;cursor:pointer;padding:14px 2px;font:600 1rem var(--f-display);color:var(--ink);display:flex;justify-content:space-between}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"+";color:var(--red);font-weight:700}
.panel details[open] summary::after{content:"–"}
.panel .sub{padding:0 0 12px}
.panel .sub h6{margin:10px 0 4px;font:600 .7rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel .sub a{display:block;padding:7px 0;color:var(--text)}
.panel>.panel-b>a{display:block;padding:14px 2px;border-bottom:1px solid var(--line);font:600 1rem var(--f-display);color:var(--ink)}

/* view transitions */
#view{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;background:var(--night);color:var(--on-dark);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:70vw;height:70vw;max-width:900px;max-height:900px;background:radial-gradient(closest-side,rgba(229,25,55,.42),rgba(229,25,55,0));z-index:-1;filter:blur(10px)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);z-index:-1}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(32px,5vw,72px);align-items:center;padding-block:clamp(64px,9vw,120px) clamp(56px,8vw,104px)}
.hero h1{color:#fff;margin-block:18px 20px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#ff4d66,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--on-dark-2)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.who{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.who span{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--on-dark);padding:8px 14px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.04)}
.who svg{width:15px;height:15px;color:#ff6a7e}
.hero-in>*{animation:rise .8s var(--ease) both}
.hero-in>*:nth-child(2){animation-delay:.06s}.hero-in>*:nth-child(3){animation-delay:.12s}.hero-in>*:nth-child(4){animation-delay:.18s}.hero-in>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
.stack{position:relative;display:grid;gap:14px}
.pc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;backdrop-filter:blur(6px);transition:transform .35s var(--ease),border-color .3s,background .3s;animation:rise .9s var(--ease) both}
.pc:nth-child(1){margin-right:44px;animation-delay:.2s}
.pc:nth-child(2){margin-left:44px;animation-delay:.32s}
.pc:nth-child(3){margin-right:22px;animation-delay:.44s}
.pc:hover{transform:translateY(-3px);border-color:rgba(229,25,55,.6);background:rgba(255,255,255,.09)}
.pc .ic{grid-row:span 2;width:46px;height:46px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:#fff}
.pc .ic svg{width:22px;height:22px}
.pc b{font:600 1rem var(--f-display);color:#fff}
.pc span{font-size:.88rem;color:var(--on-dark-2);line-height:1.45}
.pc .tag{position:absolute;right:16px;top:14px;font:600 .66rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#ff8597}
.pc{position:relative}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr}.pc:nth-child(n){margin:0}}

/* stats */
.stats{background:#fff;border-bottom:1px solid var(--line)}
.stats .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.stat{padding:30px 22px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:700 clamp(1.6rem,2.8vw,2.2rem)/1.1 var(--f-display);color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;color:var(--red)}
.stat span{font-size:.88rem;color:var(--muted)}
@media (max-width:860px){.stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(odd){border-right:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:last-child{grid-column:1/-1;border-right:0}}

/* sections */
.sec{padding-block:clamp(72px,9vw,120px)}
.sec.mist{background:var(--mist)}
.sec.dark{background:var(--night);color:var(--on-dark-2)}
.sec.dark h2,.sec.dark h3{color:#fff}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px 40px;flex-wrap:wrap;margin-bottom:48px}
.sh .t{display:grid;gap:14px;max-width:680px}

/* service groups */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.sg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:16px;transition:border-color .25s,box-shadow .3s,transform .3s var(--ease)}
.sg:hover{border-color:#d9d9e0;box-shadow:0 24px 48px -32px rgba(30,29,29,.35);transform:translateY(-3px)}
.sg .ic{width:48px;height:48px;border-radius:12px;background:var(--red-tint);color:var(--red);display:grid;place-items:center}
.sg .ic svg{width:24px;height:24px}
.sg ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sg li a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--char);font-size:.95rem;transition:color .2s,padding .25s var(--ease)}
.sg li:last-child a{border-bottom:0}
.sg li a>svg{width:16px;height:16px;color:var(--red);opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .25s var(--ease)}
.sg li a:hover{color:var(--red);padding-left:4px}
.sg li a:hover>svg{opacity:1;transform:none}

/* salesdesk band */
.sd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(36px,5vw,72px);align-items:start}
.sd .sdc{display:grid;gap:22px}
[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.84rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--char)}
.dark .chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);color:var(--on-dark)}
.case{background:var(--night-2);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:clamp(22px,3vw,34px);display:grid;gap:22px;min-width:0}
.case-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}
.case-h .eyebrow{color:#ff6a7e}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--on-dark-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.m{display:grid;gap:8px}
.m .l{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:#fff;font-weight:500}
.m .l span{color:var(--on-dark-2);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars{display:grid;gap:4px}
.bar{height:11px;border-radius:3px;transform-origin:left;animation:grow 1.1s var(--ease) both}
.bar.b{background:#5b5959}.bar.a{background:var(--red)}
@keyframes grow{from{transform:scaleX(.02)}to{transform:none}}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--on-dark-2);border-top:1px solid rgba(255,255,255,.12);padding-top:8px;font-variant-numeric:tabular-nums}
.gains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:20px}
.gains b{display:block;font:700 1.55rem/1.1 var(--f-display);color:#fff}
.gains span{font-size:.84rem}
.case small{font-size:.78rem;color:var(--on-dark-2)}
@media (max-width:920px){.sd{grid-template-columns:1fr}}
@media (max-width:520px){.gains{grid-template-columns:1fr}}

/* tabs + catalog */
.tabs{display:inline-flex;gap:4px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:12px}
.tabs button{font:600 .9rem var(--f-display);padding:10px 18px;border-radius:8px;border:0;background:transparent;color:var(--char);cursor:pointer;transition:background .25s,color .25s}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:16px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:start;transition:border-color .25s,box-shadow .3s,transform .3s var(--ease);overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red),var(--char));transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 24px 44px -30px rgba(30,29,29,.4);border-color:#dadae0}

/* quotes */

/* support strip */

.mvv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4vw,56px);align-items:start}

.office{border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:10px;background:#fff}

form.lead-f{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,3vw,36px);display:grid;gap:16px;box-shadow:0 30px 60px -45px rgba(30,29,29,.45)}

label{display:grid;gap:7px;font:500 .88rem var(--f-display);color:var(--ink)}
input,select,textarea{font:inherit;font-family:var(--f-body);font-size:1rem;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--mist);color:var(--ink);width:100%;transition:border-color .2s,background .2s,box-shadow .2s}

/* ===== logo tiles ===== */
.lt.art svg{width:78%;height:78%;display:block}

/* scroll orbs */
.sec{position:relative;isolation:isolate;overflow:clip}

.orb-r{right:-220px;top:8%;background:radial-gradient(circle,rgba(229,25,55,.16),transparent 65%)}
.orb-l{left:-240px;bottom:4%;background:radial-gradient(circle,rgba(68,67,67,.12),transparent 65%)}

.eyebrow::before{transition:width .7s var(--ease) .15s}

.lt{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line),0 8px 18px -12px rgba(30,29,29,.45);transition:transform .35s var(--ease),box-shadow .35s}
.lt img{width:100%;height:100%;object-fit:cover}

.role{grid-template-columns:auto 1fr;align-items:center;column-gap:12px}

.role .lt.lt-ic{background:rgba(229,25,55,.18);box-shadow:none;color:#ff8597}
/* tilt + spotlight */
.tilt{transform-style:preserve-3d;will-change:transform;transition:transform .25s var(--ease),box-shadow .3s,border-color .25s;background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(229,25,55,.07),transparent 45%)}
.role.tilt{background-image:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(229,25,55,.18),transparent 45%)}
/* logo marquee */
.lmarq{overflow:hidden;margin:-12px 0 28px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ltrack{display:flex;gap:14px;width:max-content;animation:marq 48s linear infinite;padding-block:10px}

/* ===== hero motion ===== */
.rot{display:inline-block}
.rot em{display:inline-block;transition:transform .32s var(--ease),opacity .32s,filter .32s}
.rot em.out{transform:translateY(-.35em) rotateX(70deg);opacity:0;filter:blur(4px)}

@keyframes wordIn{from{transform:translateY(.4em) rotateX(-70deg);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.hero{min-height:0}
.net{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);z-index:0;pointer-events:none}
.orbit-wrap{position:relative;display:grid;place-items:center;min-height:440px}
.orbit{position:relative;width:min(440px,86vw);aspect-ratio:1;z-index:1}
.core{position:absolute;inset:31%;animation-duration:5s!important;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#f3f2f4);display:grid;place-items:center;align-content:center;gap:2px;text-align:center;box-shadow:0 0 0 10px rgba(229,25,55,.12),0 0 0 22px rgba(229,25,55,.06),0 30px 60px -20px rgba(0,0,0,.6);animation:pulse 3.2s ease-in-out infinite}

@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(229,25,55,.16),0 0 0 30px rgba(229,25,55,.05),0 30px 60px -20px rgba(0,0,0,.6)}}
.ring{position:absolute;inset:0;border-radius:50%;animation:spin 70s linear infinite}

.ring.r2{inset:-2%;border:1px solid rgba(255,255,255,.08);animation-direction:reverse}
.sat{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(calc(360deg / var(--n) * var(--i))) translateY(calc(var(--rad) * -1))}
.r1 .sat{--rad:min(158px,27vw)}
.r2 .sat{--rad:min(226px,38vw)}
.sat .lt{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:16px;animation:counter 55s linear infinite;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 16px 30px -12px rgba(0,0,0,.7)}
.r2 .sat .lt{animation:counter2 70s linear infinite;width:50px;height:50px;left:-25px;top:-25px}
.sat .lt{transform:rotate(calc(-360deg / var(--n) * var(--i)))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes counter{from{transform:rotate(calc(-360deg / var(--n) * var(--i)))}to{transform:rotate(calc(-360deg / var(--n) * var(--i) - 360deg))}}

.sat:hover .lt{box-shadow:0 0 0 2px var(--red),0 16px 30px -12px rgba(229,25,55,.8)}

/* cursor glow */
.cglow{display:none;position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(229,25,55,.10),transparent 60%);mix-blend-mode:multiply;opacity:0;transition:opacity .4s;will-change:transform}
body.has-cursor .cglow{opacity:1}
/* split words */
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.sw>span{display:inline-block;transform:translateY(105%);transition:transform .8s var(--ease) calc(var(--w,0)*55ms)}
.split.on .sw>span{transform:none}
/* hero entrance blobs */
.hero .blob{position:absolute;border-radius:50%;filter:blur(50px);z-index:-1;opacity:.55;animation:blob 22s ease-in-out infinite}
.hero .b1{width:360px;height:360px;left:-120px;bottom:-140px;background:#E51937;opacity:.28}
.hero .b2{width:240px;height:240px;left:38%;top:-120px;background:#ff6a7e;opacity:.18;animation-delay:-5s}
@keyframes blob{33%{transform:translate(40px,-30px) scale(1.1)}66%{transform:translate(-30px,20px) scale(.95)}}
/* steps connector draws on scroll */
.steps{position:relative}
.steps .line{position:absolute;left:28px;right:28px;top:52px;height:3px;background:var(--line);border-radius:3px;z-index:0;overflow:hidden}
.steps .line i{position:absolute;inset:0;background:linear-gradient(90deg,var(--red),#ff6a7e);transform-origin:left;transform:scaleX(var(--p,0))}
.step{z-index:1}
.step::after{content:"";position:absolute;top:44px;right:-12px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line);transition:border-color .4s,background .4s}
.step.lit::after{border-color:var(--red);background:var(--red);box-shadow:0 0 0 6px var(--red-tint)}
.step:last-child::after{display:none}
@media (max-width:820px){.steps .line,.step::after{display:none}}
/* image reveal */
.pp .ph{clip-path:inset(0 0 100% 0);transition:clip-path 1s var(--ease) var(--d,0ms)}
.pp.in .ph,.pp:not(.rv) .ph{clip-path:inset(0)}
/* magnetic buttons */
.btn{will-change:transform}
/* scroll-linked marquee skew */
.mtrack,.ltrack{transition:transform .2s}

/* stat underline sweep */
.stat{position:relative}
.stat::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:3px;background:linear-gradient(90deg,var(--red),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease)}
.stats.on .stat::after{transform:scaleX(1)}
.stats.on .stat:nth-child(2)::after{transition-delay:.12s}.stats.on .stat:nth-child(3)::after{transition-delay:.24s}.stats.on .stat:nth-child(4)::after{transition-delay:.36s}.stats.on .stat:nth-child(5)::after{transition-delay:.48s}
/* floating tilt on sg icons */
.sg .ic{transition:transform .4s var(--ease)}
.sg:hover .ic{transform:translateY(-3px) rotate(-4deg)}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.wipe{display:none}.sw>span{transform:none!important}.pp .ph{clip-path:none!important}.cglow{display:none}}

</style>

    `<a href="#careers">Careers</a><a href="#contact">Contact</a>`;

  document.querySelectorAll("[data-dd]").forEach(nv=>{
    let t; const btn = nv.querySelector("button");
    const open = v => { if (v) document.querySelectorAll("[data-dd].open").forEach(o=>{ if(o!==nv){o.classList.remove("open");o.querySelector("button").setAttribute("aria-expanded","false")} }); nv.classList.toggle("open",v); btn.setAttribute("aria-expanded",v) };
    nv.addEventListener("mouseenter",()=>{clearTimeout(t);open(true)});
    nv.addEventListener("mouseleave",()=>{t=setTimeout(()=>open(false),140)});
    btn.addEventListener("click",()=>open(!nv.classList.contains("open")));
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){document.querySelectorAll("[data-dd].open").forEach(o=>o.classList.remove("open"));toggleDrawer(false)} });
  document.addEventListener("click",e=>{ if(!e.target.closest("[data-dd]")) document.querySelectorAll("[data-dd].open").forEach(o=>o.classList.remove("open")) });

  const dr = $("#drawer");
  window.toggleDrawer = v => { dr.classList.toggle("open",v); dr.setAttribute("aria-hidden",!v); document.body.style.overflow = v ? "hidden" : "" };
  $("#burger").addEventListener("click",()=>toggleDrawer(true));
  dr.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>toggleDrawer(false)));
  dr.addEventListener("click",e=>{ if(e.target.closest("a")) toggleDrawer(false) });
}

/* ---------- router ---------- */
const HOME_ANCHORS = ["services","products","apps","staffing","team"];
let current = null;
function route(){

  if (P[h]) page = h;

  else if (HOME_ANCHORS.includes(h)) { page = "home"; anchor = h; }
  const v = $("#view");
  if (page !== current) {
    v.innerHTML = page==="home"?home():page==="about"?about():page==="careers"?careers():page==="contact"?contact():detail(page);
    v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
    current = page;
    wire();
    document.title = page==="home" ? "SconexSoft" : (P[page]?P[page].title:page[0].toUpperCase()+page.slice(1)) + " · SconexSoft";
    if (!anchor) window.scrollTo({top:0,behavior:"instant" in window?"instant":"auto"});
  }
  if (anchor) {
    if (anchor === "apps") showTab("a");
    if (anchor === "products") showTab("p");
    const el = document.getElementById(anchor==="apps"?"products":anchor);
    if (el) requestAnimationFrame(()=>el.scrollIntoView({behavior:"smooth",block:"start"}));
  }
  document.querySelectorAll("#nav [data-r]").forEach(a=>a.classList.toggle("on", a.dataset.r===page));
  $("#mast").classList.toggle("on-dark", page==="home");
  motion();
}
function showTab(t){
  const p=$("#catP"), a=$("#catA"); if(!p) return;
  p.hidden = t!=="p"; a.hidden = t!=="a";
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
}
function wire(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
  document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.copy, done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};
    try{ navigator.clipboard.writeText(v).then(done,()=>sel(b)) }catch(e){ sel(b) }
  }));
  const f=$("#leadf");
  if(f) f.addEventListener("submit",e=>{
    e.preventDefault(); const m=$("#fmsg"), n=$("#f-name"), em=$("#f-email"); m.hidden=false;

    m.textContent="Thanks, "+n.value.trim().split(" ")[0]+". This preview isn't connected to email yet. On the live site this form will send your message to sales@sconexsoft.com.";
  });
}
function sel(b){ const r=document.createRange(); r.selectNodeContents(b.parentNode.firstChild); const s=getSelection(); s.removeAllRanges(); s.addRange(r) }


/* ---------- motion ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let netStop = null, rotTimer = null;
function motion(){
  // scroll reveal: only things below the first screen start hidden, so the page is complete at rest
  const vh = innerHeight;
  const els = document.querySelectorAll("#view .sh, #view .sg, #view .card, #view .role, #view .step, #view .pp, #view .q, #view .feat, #view .mod, #view .stackg>div, #view .mvv>div, #view .office, #view .case, #view .ctaband, #view .support, #view .marq");
  if (!RM && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target) } }),{rootMargin:"0px 0px -8% 0px"});
    els.forEach((el,i)=>{ const r=el.getBoundingClientRect(); if(r.top>vh*0.92){ el.classList.add("rv"); el.style.setProperty("--d",(i%4)*70+"ms"); io.observe(el) } });
  }
  // counters
  const cio = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ count(e.target); cio.unobserve(e.target) } }),{threshold:.6}) : null;
  document.querySelectorAll("#view [data-count]").forEach(el=>{ if(RM||!cio) return; cio.observe(el) });
  // bars replay when case study enters
  document.querySelectorAll("#view .case").forEach(c=>{ c.classList.add("paused"); const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ c.classList.remove("paused"); o.disconnect() } },{threshold:.35}); o.observe(c) });
  // rotating headline word
  clearInterval(rotTimer);
  const rw = document.querySelector("#view .rot em");
  if (rw && !RM) { const W=rw.dataset.words.split("|"); let i=0; rotTimer=setInterval(()=>{ i=(i+1)%W.length; rw.classList.add("out"); setTimeout(()=>{ rw.textContent=W[i]; rw.classList.remove("out"); rw.classList.add("inw"); setTimeout(()=>rw.classList.remove("inw"),450) },320) },3400) }
  // split headings into words that rise in
  document.querySelectorAll("#view h1, #view .sh h2").forEach(h=>{
    if (RM || h.classList.contains("split")) return;
    let w=0; const walk=n=>{ [...n.childNodes].forEach(c=>{ if(c.nodeType===3){ const frag=document.createDocumentFragment(); c.textContent.split(/(\s+)/).forEach(s=>{ if(!s) return; if(/^\s+$/.test(s)){ frag.append(s); return } const o=document.createElement("span"); o.className="sw"; const i=document.createElement("span"); i.textContent=s; o.style.setProperty("--w",w++); o.append(i); frag.append(o) }); c.replaceWith(frag) } else if(c.nodeType===1 && !c.classList.contains("rot")) walk(c) }) };
    walk(h); h.classList.add("split");
    const r=h.getBoundingClientRect(); if(r.top<innerHeight*.95){ requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.add("on"))) } else { const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ h.classList.add("on"); o.disconnect() } },{threshold:.4}); o.observe(h) }
  });
  // stats underline
  const st=document.querySelector("#view .stats"); if(st){ const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ st.classList.add("on"); o.disconnect() } },{threshold:.5}); o.observe(st) }
  // magnetic buttons
  if(false) document.querySelectorAll("#view .btn-red").forEach(b=>{
    if(b.dataset.mag) return; b.dataset.mag=1;
    b.addEventListener("pointermove",e=>{ const r=b.getBoundingClientRect(); b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.3}px)` });
    b.addEventListener("pointerleave",()=>b.style.transform="");
  });
  STEPS=document.getElementById("steps");
  // tilt + spotlight
  document.querySelectorAll("#view .tilt").forEach(t=>{
    if (RM || matchMedia("(hover: none)").matches) return;
    t.addEventListener("pointermove",e=>{ const r=t.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; t.style.setProperty("--mx",x*100+"%"); t.style.setProperty("--my",y*100+"%"); t.style.transform=`perspective(900px) rotateX(${(.5-y)*3}deg) rotateY(${(x-.5)*3.5}deg) translateY(-3px)` });
    t.addEventListener("pointerleave",()=>{ t.style.transform="" });
  });
  // hero network canvas
  if (netStop) { netStop(); netStop=null }
  const cv = document.getElementById("net"); if (cv) netStop = network(cv);
  // scroll parallax targets
  document.querySelectorAll("#view .sec.mist, #view .sec:not(.dark):not(.mist)").forEach((s,i)=>{ if(s.querySelector(":scope>.orb")) return; const o=document.createElement("span"); o.className="orb "+(i%2?"orb-l":"orb-r"); o.setAttribute("aria-hidden","true"); o.dataset.par=i%2?"-0.1":"0.08"; s.prepend(o) });
  const set=(sel,f)=>document.querySelectorAll(sel).forEach(e=>e.dataset.par=f);
  set("#view .hero-in","-0.06"); set("#view .orbit-wrap","0.06"); set("#view .ph-art","0.08");
  PAR = [...document.querySelectorAll("#view [data-par]")];
  parallax();
}
let PAR = [], parQueued = false;
let STEPS=null, lastY=scrollY, skew=0;
function parallax(){
  parQueued = false; if (RM) return;
  const vh = innerHeight;
  // velocity skew on marquees + orbit spin boost
  const dy=scrollY-lastY; lastY=scrollY; skew += (Math.max(-8,Math.min(8,dy*.25)) - skew)*.5;

  // steps connector progress
  if(STEPS){ const r=STEPS.getBoundingClientRect(); const p=Math.max(0,Math.min(1,(vh*.75-r.top)/(r.height+vh*.25))); STEPS.style.setProperty("--p",p.toFixed(3)); STEPS.querySelectorAll(".step").forEach((s,i,arr)=>s.classList.toggle("lit",p>(i+.6)/arr.length)) }
  for (const el of PAR) {
    const r = el.getBoundingClientRect(); if (r.bottom < -200 || r.top > vh + 200) continue;
    const off = (r.top + r.height/2 - vh/2) * parseFloat(el.dataset.par);
    el.style.translate = `0 ${off.toFixed(1)}px`;
  }
}
addEventListener("scroll", ()=>{ if(!parQueued){ parQueued=true; requestAnimationFrame(parallax) } }, {passive:true});
addEventListener("resize", ()=>requestAnimationFrame(parallax));
let settle; addEventListener("scroll",()=>{ clearTimeout(settle); settle=setTimeout(()=>{ lastY=scrollY; parQueued=true; requestAnimationFrame(parallax) },120) },{passive:true});
(()=>{ const g=document.getElementById("cglow"); if(true||!g||RM||matchMedia("(hover: none)").matches) return; let x=0,y=0,tx=0,ty=0,on=false;
  addEventListener("pointermove",e=>{ tx=e.clientX; ty=e.clientY; if(!on){ on=true; document.body.classList.add("has-cursor"); loop() } },{passive:true});
  document.addEventListener("pointerleave",()=>{ document.body.classList.remove("has-cursor") });
  function loop(){ x+=(tx-x)*.12; y+=(ty-y)*.12; g.style.transform=`translate(${x}px,${y}px)`; requestAnimationFrame(loop) } })();
function count(el){
  const to=+el.dataset.count, plain=el.hasAttribute("data-plain"), from=plain?to-7:0, suf=el.dataset.suffix||"", t0=performance.now(), dur=plain?900:1400;
  const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e)+suf; if(p<1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
function network(cv){
  const ctx=cv.getContext("2d"); let w,h,dpr,pts,raf,alive=true, mouse={x:-999,y:-999};
  const size=()=>{ const r=cv.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); w=r.width; h=r.height; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(42,w*h/14000)); pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.6+.6})) };
  size(); const ro=new ResizeObserver(size); ro.observe(cv);
  const host=cv.closest(".hero"); const mm=e=>{ const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top }; host&&host.addEventListener("pointermove",mm);
  const draw=()=>{ if(!alive) return; ctx.clearRect(0,0,w,h);
    for(const p of pts){ if(!RM){p.x+=p.vx;p.y+=p.vy} if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1 }
    for(let i=0;i<pts.length;i++){ const a=pts[i];
      for(let j=i+1;j<pts.length;j++){ const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy; if(d<11000){ ctx.strokeStyle=`rgba(229,25,55,${(1-d/11000)*.22})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke() } }
      const md=(a.x-mouse.x)**2+(a.y-mouse.y)**2; if(md<26000){ ctx.strokeStyle=`rgba(255,255,255,${(1-md/26000)*.18})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke() }
      ctx.fillStyle="rgba(255,120,140,.9)"; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill() }
    if(!RM && vis) raf=requestAnimationFrame(draw) };
  let vis=true; const vio=new IntersectionObserver(es=>{ vis=es[0].isIntersecting; if(vis&&alive&&!RM){ cancelAnimationFrame(raf); raf=requestAnimationFrame(draw) } }); vio.observe(cv);
  const draw0=draw; 
  draw();
  return ()=>{ alive=false; vio.disconnect(); cancelAnimationFrame(raf); ro.disconnect(); host&&host.removeEventListener("pointermove",mm) };
}
